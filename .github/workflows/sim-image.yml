name: sim-image

on:
  pull_request:
    paths:
      - "docker/**"
      - "ros_ws/**"
      - "scripts/check_sim_boot.py"
      - "scripts/check_sim.py"
      - ".github/workflows/sim-image.yml"
      - "src/armbench/**"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "ros_ws/**"
      - "scripts/check_sim_boot.py"
      - "scripts/check_sim.py"
      - ".github/workflows/sim-image.yml"
      - "src/armbench/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build simulation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: armbench-sim:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot empty headless world (F0 gate)
        run: python3 scripts/check_sim_boot.py --image armbench-sim:dev --repeats 3 --out reports/f0_sim.ci.json
      # GitHub runners (4 vCPU, software ogre2) render the RGB-D camera at ~9.6 FPS sim; the
      # 10 FPS acceptance threshold is for the development host (reports/f1_sim.json).
      - name: UR5e + gripper + RGB-D self-check (F1 gate)
        run: python3 scripts/check_sim.py --image armbench-sim:dev --repeats 3 --camera-fps-min 8 --out reports/f1_sim.ci.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --locked
      - name: One Gazebo episode end to end (baseline A, pick_place@1, dev seed 0)
        run: |
          uv run armbench run --task pick_place@1 --agent A --seeds 0 --backend sim \
            --image armbench-sim:dev --out runs/ci_smoke
          grep -q '"ok": *true' runs/ci_smoke/episodes.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim_reports
          path: |
            reports/f0_sim.ci.json
            reports/f1_sim.ci.json
            runs/ci_smoke/episodes.jsonl
