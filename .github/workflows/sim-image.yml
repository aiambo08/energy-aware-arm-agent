name: sim-image

on:
  pull_request:
    paths:
      - "docker/**"
      - "ros_ws/**"
      - "scripts/check_sim_boot.py"
      - ".github/workflows/sim-image.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "ros_ws/**"
      - "scripts/check_sim_boot.py"
      - ".github/workflows/sim-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build simulation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: armbench-sim:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot empty headless world (F0 gate)
        run: python3 scripts/check_sim_boot.py --image armbench-sim:dev --repeats 3 --out reports/f0_sim.ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f0_sim_report
          path: reports/f0_sim.ci.json
