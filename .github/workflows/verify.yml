name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q -m "not sim" --cov=src/armbench --cov-report=term --cov-fail-under=80
      - name: Protocol f9-v1 still matches the repository
        run: uv run armbench protocol verify
      - name: Replay one F9 episode from the committed dataset (no key, no ROS)
        run: uv run python scripts/demo.py --task pick_place --agent C --seed 100

  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links in Markdown and the results page
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments=none "./**/*.md" site/index.html
          fail: true
