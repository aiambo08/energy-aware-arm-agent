# Nebius Token Factory over its OpenAI-compatible endpoint
# (https://docs.tokenfactory.nebius.com/api-reference/introduction). Paid credit shared with
# other projects, so every run is capped and all runs together are capped by max_usd_total
# (ledger cache/llm/spend.json). Use: the pre-registered evaluation (hybrid plan, F9).
#   export ARMBENCH_NEBIUS_API_KEY=...        # https://tokenfactory.nebius.com/ > API keys
#   uv run armbench llm models --llm-config configs/llm.nebius.yaml   # ids + real prices
#   uv run armbench llm check  --llm-config configs/llm.nebius.yaml
schema_version: 1
provider: openai
model: meta-llama/Llama-3.3-70B-Instruct   # placeholder: confirm with `armbench llm models` (D6)
temperature: 0.0
max_tokens: 1500
seed: 0
max_attempts: 1
max_tokens_per_episode: 8000
max_usd_per_run: 2.0
max_usd_total: 3.0
prices_usd_per_1m: {input: 0.5, output: 1.5}   # deliberate upper bound until `llm models` gives the real ones
cache_dir: cache/llm
openai:
  base_url: https://api.tokenfactory.nebius.com/v1/
  api_key_env: ARMBENCH_NEBIUS_API_KEY
  timeout_s: 120.0
  max_retries: 3
  backoff_s: 2.0
  min_interval_s: 0.0
  max_retry_after_s: 120.0
sandbox:
  cpu_s: 10.0
  memory_mb: 512
  wall_s: 300.0
  sim_s: 60.0
  max_calls: 200
  stdout_kb: 16
  max_source_chars: 20000
  max_nodes: 5000
