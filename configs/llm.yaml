# LLM agent B (armbench.agents.llm, phase F6). The provider is swapped here, never in code:
#   template  deterministic stand-in that writes a program from the task sentence (no network,
#             no key; infrastructure testing only — not evidence about any language model)
#   openai    any OpenAI-compatible chat endpoint; the key comes from the environment variable
#             named in openai.api_key_env (never from this file or the command line)
#   replay    disk cache only; a prompt that was never answered is an error (reproduction mode,
#             and what runs inside the --network none simulation containers)
schema_version: 1
provider: template
model: template-v1             # part of the cache key; set e.g. gpt-4o-mini with provider: openai
temperature: 0.0
max_tokens: 1500
seed: 0                        # forwarded to providers that support it
max_attempts: 1                # program generations per episode (D5: single turn in the main evaluation)
max_tokens_per_episode: 8000   # prompt + completion over all attempts; above -> episode fails (agent:token_budget)
max_usd_per_run: 5.0           # the run aborts before a live call that could cross this
prices_usd_per_1m: {input: 0.0, output: 0.0}   # template is free; e.g. gpt-4o-mini: {input: 0.15, output: 0.60}
cache_dir: cache/llm           # hash(model, temperature, seed, max_tokens, messages) -> request + response JSON
openai:
  base_url: https://api.openai.com/v1
  api_key_env: ARMBENCH_LLM_API_KEY
  timeout_s: 60.0
  max_retries: 2
  backoff_s: 2.0
sandbox:                       # per generated program
  cpu_s: 10.0                  # CPU seconds of the child (program logic; time inside primitives is the parent's)
  memory_mb: 512               # address-space limit of the child
  wall_s: 300.0                # whole program, primitives included
  sim_s: 60.0                  # simulated seconds before the program is stopped (task limit)
  max_calls: 200               # primitive calls per program
  stdout_kb: 16                # captured print() output kept in the log
  max_source_chars: 20000
  max_nodes: 5000
