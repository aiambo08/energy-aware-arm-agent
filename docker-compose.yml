# Quickstart services (phase F10). No GPU, no API key, no ROS:
#   docker compose run --rm demo                                   # replay one F9 episode
#   docker compose run --rm demo --task sort3 --agent B+S --seed 107
# The repository is mounted read-write so the demo can extract data/f9-v1.tar.gz into
# .armbench/ and seed cache/llm; it runs as your user when UID/GID are exported.
services:
  demo:
    image: ghcr.io/astral-sh/uv:0.8.22-python3.12-bookworm
    working_dir: /repo
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/repo
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/armbench-venv
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PYTHON_DOWNLOADS: never
      HOME: /tmp
      # the bind mount is owned by the host user; let git read it for `protocol verify`
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    entrypoint: ["uv", "run", "--locked", "--no-dev", "python", "scripts/demo.py"]
