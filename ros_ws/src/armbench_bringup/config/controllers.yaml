controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: effort_controllers/JointGroupEffortController

    # 100 Hz copy of the arm state for the energy meter (ADR-004): a Python subscriber costs
    # ~10 % of a core at 500 Hz regardless of what it does, so the meter reads this topic.
    energy_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

energy_state_broadcaster:
  ros__parameters:
    update_rate: 100
    use_local_topics: true  # publishes /energy_state_broadcaster/joint_states
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interfaces:
      - position
      - velocity
      - effort

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 0.2, goal: 0.05 }
      shoulder_lift_joint: { trajectory: 0.2, goal: 0.05 }
      elbow_joint: { trajectory: 0.2, goal: 0.05 }
      wrist_1_joint: { trajectory: 0.2, goal: 0.05 }
      wrist_2_joint: { trajectory: 0.2, goal: 0.05 }
      wrist_3_joint: { trajectory: 0.2, goal: 0.05 }

gripper_controller:
  ros__parameters:
    joints:
      - left_finger_joint
      - right_finger_joint
